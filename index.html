<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Calculator</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#667eea,#764ba2);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:350px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,.3);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        input,
        select{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#667eea;
            color:white;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#4d5ed6;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Calculator</h1>

<form action="/" method="post">

    <input
        type="number"
        name="num1"
        placeholder="Enter First Number"
        required
    >

    <select name="operation">

        <option value="+">Addition (+)</option>

        <option value="-">Subtraction (-)</option>

        <option value="*">Multiplication (×)</option>

        <option value="/">Division (÷)</option>

        <option value="%">Modulus (%)</option>

    </select>

    <input
        type="number"
        name="num2"
        placeholder="Enter Second Number"
        required
    >

    <button type="submit">
        Calculate
    </button>

</form>

</div>

</body>
</html>
